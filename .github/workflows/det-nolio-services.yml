name: DET — déployer les fonctions Nolio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/det-nolio-services.yml'
      - 'supabase/functions/det-nolio-connect/**'
      - 'supabase/functions/det-nolio-callback/**'
      - 'supabase/functions/det-nolio-export/**'

permissions:
  contents: read

concurrency:
  group: det-nolio-services-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier l’accès au projet Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::L’accès de déploiement Supabase n’est pas configuré dans ce dépôt."
            exit 1
          fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: Publier les trois fonctions DET sur TFCLab 2.1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          for fn in det-nolio-connect det-nolio-callback det-nolio-export; do
            supabase functions deploy "$fn" --remote=wtwjkmawntybyehatkjo --use-api --yes
          done
      - name: Vérifier la disponibilité HTTP des fonctions
        run: |
          set -eu
          for fn in det-nolio-connect det-nolio-export; do
            curl --silent --show-error --fail --retry 3 --request OPTIONS "https://wtwjkmawntybyehatkjo.supabase.co/functions/v1/$fn"
          done
