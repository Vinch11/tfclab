name: Preproduction artifacts (offline, no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/preproduction/**'
      - '.github/workflows/preproduction-artifacts.yml'
      - 'src/lib/plan/planStatPrivacy.ts'
      - 'supabase/functions/_shared/planReleaseInfo.ts'
      - 'vite.config.ts'
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Negative checksum and mixed-release tests
        run: node --test scripts/preproduction/verify-plan-release.checks.mjs
      - name: Lovable ordinary build without preparation metadata
        run: |
          node scripts/preproduction/plan-release-source.mjs
          env -u TFCL_PLAN_RELEASE_INFO -u SOURCE_DATE_EPOCH bun run build
          node -e 'const m=JSON.parse(require("node:fs").readFileSync("dist/plan-release.json","utf8")); if(m.manifestVersion!==2 || m.attested!==false || m.provenance!=="declared-source" || !m.releaseId) process.exit(1)'
      - name: Lovable build with injected environment metadata
        run: |
          test ! -e src/tailwind.config.lov.json
          cp dist/plan-release.json /tmp/tfcl-release-without-lovable.json
          trap 'rm -f src/tailwind.config.lov.json' EXIT
          printf '%s\n' '{"theme":{"extend":{}}}' > src/tailwind.config.lov.json
          env -u TFCL_PLAN_RELEASE_INFO -u SOURCE_DATE_EPOCH bun run build
          cmp /tmp/tfcl-release-without-lovable.json dist/plan-release.json
      - name: Build twice from the same immutable commit
        run: |
          node scripts/preproduction/prepare-plan-release.mjs --commit HEAD --out /tmp/tfcl-release-a
          node scripts/preproduction/prepare-plan-release.mjs --commit HEAD --out /tmp/tfcl-release-b
          node scripts/preproduction/verify-plan-release.mjs /tmp/tfcl-release-a/manifest.json /tmp/tfcl-release-b/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan-preproduction-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/tfcl-release-a/
          retention-days: 7
