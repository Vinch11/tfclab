name: DET V31 — deterministic V3 bridge contract
on:
  pull_request:
    branches: [experiment/det-engine]
    paths:
      - "experimental/det-engine/v3*"
      - "experimental/det-engine/engine.ts"
      - "experimental/det-engine/vitest.v31.config.ts"
      - "scripts/library-v3/**"
      - ".github/workflows/det-v31-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v31-contract:
    name: TypeScript + deterministic V31 bridge integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p experimental/det-engine/tsconfig.json
      - run: bunx vitest run --config experimental/det-engine/vitest.v31.config.ts
