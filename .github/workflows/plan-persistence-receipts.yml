name: Plan persistence receipts

on:
  pull_request:
    paths:
      - 'src/hooks/usePlanAdaptation.ts'
      - 'src/hooks/__tests__/usePlanAdaptation.archiveFailClosed.test.ts'
      - 'src/lib/plan/planWriteReceipt.ts'
      - 'src/lib/plan/__tests__/planWriteReceipt.test.ts'
      - '.github/workflows/plan-persistence-receipts.yml'

jobs:
  exact-write-receipts:
    name: Exact archive/current receipts — both adaptation routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Behavioral hook tests and exact receipt contract
        run: bunx vitest run src/hooks/__tests__/usePlanAdaptation.archiveFailClosed.test.ts src/lib/plan/__tests__/planWriteReceipt.test.ts

      - name: Calculate candidate source declaration without replacing checked-in manifest
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {calculatePlanRelease,declarationText,readDeclaration,assertSameDeclaration} from './scripts/preproduction/plan-release-source.mjs';
          const {info}=await calculatePlanRelease(process.cwd());
          writeFileSync('plan-release-manifest.candidate.ts',declarationText(info));
          assertSameDeclaration(info,readDeclaration(process.cwd()));
          console.log('CANDIDATE_SOURCE_DECLARATION '+JSON.stringify(info));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-persistence-source-declaration
          path: plan-release-manifest.candidate.ts
          retention-days: 14
