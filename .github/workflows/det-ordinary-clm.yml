name: DET · formulaire ordinaire TFCLab 2.1
on:
  push:
    branches: ['det-integration/tfclab-21-clm-*']
  pull_request:
    paths: ['integrations/det/**', 'public/__det/**', '.github/workflows/det-ordinary-clm.yml', 'index.html']
permissions:
  contents: read
jobs:
  ordinary-form:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Construire la vue DET avec le formulaire et les limiteurs de cette version
        run: |
          rm -rf public/__det/coach
          node integrations/det/build.mjs public/__det/coach
      - name: Installer le navigateur de recette
        run: |
          npm install --prefix "$RUNNER_TEMP/det-test" --no-audit --no-fund playwright@1.57.0
          ln -s "$RUNNER_TEMP/det-test/node_modules" integrations/det/node_modules
          "$RUNNER_TEMP/det-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Calculer un vrai plan depuis le formulaire, les services externes étant simulés
        run: node integrations/det/ordinary-form.browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tfclab-21-det-coach
          path: public/__det/
          include-hidden-files: true
