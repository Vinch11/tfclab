name: CI

# Aucune CI n'existait avant ce fichier (aucun workflow, aucun script "test"
# dans package.json) — trouvé en auditant la génération de plan (sept. 2026).
# Conséquence concrète : chaque fichier *.test.ts Deno de ce dépôt (edge
# functions, supabase/functions/ai-training-plan/) a été écrit et "vérifié"
# uniquement par lecture/raisonnement manuel ou reproduction isolée dans un
# autre runtime (Deno indisponible dans les environnements de dev utilisés),
# jamais par une exécution réelle automatisée. Un bug de fixture réel a été
# trouvé de cette façon (jsonPlanHandler.dailySessionFloorEnforcement.test.ts
# aurait échoué s'il avait tourné). Ce workflow fait tourner pour de vrai,
# sur chaque push/PR, la suite vitest (frontend) ET la suite Deno (edge
# functions) — sans lui, ces fichiers restent des tests seulement sur le
# papier.
#
# Job playwright (ajouté — audit "produit fini") : `@playwright/test` était
# déjà une dépendance mais jamais configuré ni exécuté (aucun .spec.ts,
# aucune config) — trouvé en auditant le bug "Exporter un rapport ne fait
# rien" (menu mobile "Plus", iOS Safari, PR #296). Un test unitaire jsdom ne
# peut PAS voir ce type de bug (interaction tactile réelle dans un vrai
# moteur de rendu) ; ce job rejoue le scénario dans un vrai navigateur
# (Chromium — pas de WebKit disponible en CI standard, donc pas une
# reproduction exacte du quirk Safari, mais un vrai filet fonctionnel).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    name: Vitest (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run vitest run

  playwright:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # chromium (Desktop Chrome) + webkit (Mobile Safari, devices["iPhone 13"]
      # — son `defaultBrowserType` est webkit, pas chromium : un vrai iPhone
      # tourne sous Safari/WebKit, jamais sous Chrome). webkit est ce qui
      # permet de reproduire le mécanisme RÉEL du bug #296 (séquence souris
      # de compatibilité ~300ms après touchend, spécifique à WebKit) — pas
      # disponible dans l'environnement de dev utilisé pour la validation
      # manuelle de cette PR (sandbox restreint à chromium), mais installable
      # normalement ici.
      - run: bunx playwright install --with-deps chromium webkit
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deno-test:
    name: Deno test (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno tests (ai-training-plan)
        working-directory: supabase/functions/ai-training-plan
        # -A (toutes permissions) : ces fichiers sont notre propre code, pas
        # du code non fiable — certains imports transitifs peuvent lire des
        # variables d'env au chargement du module. À resserrer plus tard si
        # besoin (--allow-env --allow-read suffiraient probablement).
        #
        # --node-modules-dir=none : premier run réel de cette CI (jamais
        # exécutée avant) révélait "Failed resolving types... npm:zod@3.23.8"
        # sur generateChunkJSON.ts — Deno 2 remonte l'arborescence et trouve
        # le package.json RACINE du repo (frontend Vite/bun, sans rapport)
        # et bascule en résolution npm "node_modules local", qui n'existe
        # pas ici (ce dossier n'a ni deno.json ni node_modules propres). Ce
        # flag force le mode cache npm global de Deno (celui réellement
        # utilisé par Supabase Edge Functions en production), sans dépendre
        # du package.json racine.
        run: deno test -A --node-modules-dir=none
