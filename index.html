<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

    <meta name="description" content="Laboratoire de performance par Two For Coaching. Analyse physiologique staff-grade, VLamax, TTE, planification triathlon/marathon, coaching intelligence." />
    <meta name="keywords" content="Two For Coaching Lab, VLamax, TTE, triathlon, marathon, cyclisme, coaching, FTP, VO2max, performance, analyse physiologique, staff" />
    <link rel="canonical" href="https://vinceslab.lovable.app" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2FC Lab" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    
    <meta property="og:title" content="Two For Coaching Lab - Staff-grade Performance Intelligence" />
    <meta property="og:description" content="Laboratoire de performance dédié à l'analyse physiologique et à l'accompagnement décisionnel des staffs." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TwoForCoaching" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <!-- Splash Screen (visible before React loads) -->
    <div id="splash-screen" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1c2128 100%);
      transition: opacity 0.5s ease-out;
    ">
      <img 
        src="/pwa-512x512.png" 
        alt="Two For Coaching Lab" 
        style="
          width: 120px;
          height: 120px;
          object-fit: contain;
          animation: pulse 2s infinite;
          filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));
        "
      />
      <div style="
        display: flex;
        gap: 6px;
        margin-top: 24px;
      ">
        <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s infinite;"></div>
        <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s infinite 0.15s;"></div>
        <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s infinite 0.3s;"></div>
      </div>
      <p style="
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        font-family: system-ui, -apple-system, sans-serif;
      ">Chargement...</p>
      <style>
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.9; }
        }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-8px); }
        }
      </style>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
