<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="tfcl-det-project" content="%VITE_SUPABASE_URL%" />
    <meta name="tfcl-det-public-key" content="%VITE_SUPABASE_PUBLISHABLE_KEY%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/src/styles/loading.css" />
    <title>Two For Coaching Lab - Performance Analysis & Coaching Intelligence</title>
    <meta name="description" content="Laboratoire de performance par Two For Coaching. Analyse physiologique staff-grade, VLamax, TTE, planification triathlon/marathon, coaching intelligence." />
    <meta name="keywords" content="Two For Coaching Lab, VLamax, TTE, triathlon, marathon, cyclisme, coaching, FTP, VO2max, performance, analyse physiologique, staff" />
    <link rel="canonical" href="https://vinceslab.lovable.app" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2FC Lab" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    
    <meta property="og:title" content="Two For Coaching Lab - Staff-grade Performance Intelligence" />
    <meta property="og:description" content="Laboratoire de performance dédié à l'analyse physiologique et à l'accompagnement décisionnel des staffs." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TwoForCoaching" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <!-- React replaces this first paint when its first screen is ready. -->
    <div id="root">
      <div id="splash-screen" class="loading-screen">
        <div class="loading-card">
          <div class="loading-cover">
            <img id="splash-logo-img" class="loading-logo" src="/src/assets/logo-2fc.png" alt="Logo TFCLab" />
            <div class="loading-brand">Two For<br />Coaching Lab</div>
          </div>
          <div class="loading-status" role="status">
            <span>Ouverture de TFCLab…</span>
            <span class="loading-rail" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark" || theme === "emerald") {
          document.getElementById("splash-screen").setAttribute("data-dark", "");
        }
        const cachedLogo = localStorage.getItem("tfcl_cached_logo_url");
        if (cachedLogo) {
          const logo = document.getElementById("splash-logo-img");
          const fallback = logo.src;
          logo.onerror = () => {
            logo.onerror = null;
            delete logo.dataset.custom;
            logo.alt = "Logo TFCLab";
            logo.src = fallback;
          };
          logo.dataset.custom = "true";
          logo.alt = "Logo du coach";
          logo.src = cachedLogo;
        }
      } catch { /* Storage may be unavailable on first paint. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
